<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Heaven | تأكيد الطلب</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #F7F7F7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #2F5735;
      text-align: center;
    }

    .checkmark-wrapper {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      border-radius: 50%;
      border: 6px solid #2F5735;
      position: relative;
      animation: pop 0.5s ease-out forwards;
    }

    .checkmark {
      width: 60px;
      height: 30px;
      border-left: 6px solid #2F5735;
      border-bottom: 6px solid #2F5735;
      transform: rotate(-45deg) scale(0);
      animation: draw 0.5s ease-out 0.5s forwards;
    }

    @keyframes draw {
      to { transform: rotate(-45deg) scale(1); }
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      margin-top: 25px;
      font-size: 26px;
    }

    p {
      margin-top: 10px;
      font-size: 18px;
    }

    .order-number {
      background-color: #E3E3E3;
      border-radius: 8px;
      padding: 5px 10px;
      display: inline-block;
      margin-top: 15px;
      font-weight: bold;
    }

    .btn {
      margin-top: 25px;
      background: linear-gradient(to right, #2F5735, #4CAF50);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 17px;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="checkmark-wrapper">
    <div class="checkmark"></div>
  </div>

  <h1>تم استلام طلبك بنجاح!</h1>
  <p>سيتم تجهيز الطلب وتسليمه في أقرب وقت ممكن.</p>
  <div class="order-number">رقم الطلب: #82639510424</div><br>
  <button class="btn" onclick="window.location.href='shop.html'">العودة للمتجر</button>

</body>
</html>
