<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Heaven | الدفع</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

‎  <!-- شريط التنقل -->
  <header class="navbar">
    <div class="logo">🌿 Green Heaven</div>
    <nav>
      <ul>
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="shop.html">المتجر</a></li>
        <li><a href="care.html">نصائح العناية</a></li>
        <li><a href="cart.html">السلة</a></li>
      </ul>
    </nav>
  </header>

‎  <!-- قسم الدفع -->
  <section class="checkout">
    <h1>إتمام عملية الدفع</h1>
    <p class="checkout-info">الرجاء تعبئة بيانات الدفع الخاصة بك لإكمال الشراء.</p>

    <form id="checkout-form">
      <div class="form-group">
        <label>الاسم على البطاقة:</label>
        <input type="text" id="name" required>
      </div>

      <div class="form-group">
        <label>رقم البطاقة:</label>
        <input type="text" id="card-number" maxlength="16" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>تاريخ الانتهاء:</label>
          <input type="month" id="expiry" required>
        </div>
        <div class="form-group">
          <label>رمز الأمان (CVC):</label>
          <input type="text" id="cvc" maxlength="3" required>
        </div>
      </div>

      <div class="checkout-total">
        <p>إجمالي المبلغ: <span id="checkout-total">150</span> ريال</p>
      </div>

      <button type="submit" class="btn">إتمام الشراء</button>
    </form>
  </section>

  <footer class="footer">
    <p>©️ 2025 Green Heaven. جميع الحقوق محفوظة.</p>
  </footer>

  <script>
    const form = document.getElementById("checkout-form");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      alert("تم الدفع بنجاح! شكراً لتسوقك معنا 🌿");
      window.location.href = "confirmation.html";
    });
  </script>

</body>
</html>
